[workspace]
members = ["src/client/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
grootscape-engine = { path = "src/client/grootscape-engine" }
grootscape-protocol = { path = "src/client/grootscape-protocol" }
console_error_panic_hook = "0.1.7"
env_logger = "0.11.12"
jni = "0.22.4"
log = "0.4"
pollster = "1.0.3"
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
wgpu = { version = "30.0.2", features = ["webgl"] }
winit = "0.30.13"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
