version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
  - package-ecosystem: npm
    directory: /tests/web
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
