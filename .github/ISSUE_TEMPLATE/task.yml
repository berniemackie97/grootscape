name: Engineering task
description: A scoped, independently shippable piece of engineering work.
title: "[Task]: "
labels: ["type: task", "status: triage"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: The change this task delivers, in one or two sentences.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server
        - Wire protocol
        - Engine / renderer
        - Platform host
        - Content pipeline
        - Build, CI, or infrastructure
        - Documentation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that must hold before the task closes.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Automated tests, fixtures, smoke tests, or measurements that prove the criteria. Performance claims name the workload and the target.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Blocking issues, open decisions, platform constraints, and compatibility impact.
  - type: input
    id: parent
    attributes:
      label: Parent feature
      description: The feature or epic this task belongs to.
      placeholder: "#1"
