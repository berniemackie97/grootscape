name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130
  CARGO_NDK_VERSION: 4.1.2

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404
      - run: dotnet restore Grootscape.slnx --locked-mode
      - run: dotnet format Grootscape.slnx --verify-no-changes --no-restore
      - run: dotnet build Grootscape.slnx --configuration Release --no-restore
      - run: dotnet test --solution Grootscape.slnx --configuration Release --no-build

  server-image:
    name: Server container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file deploy/server.Dockerfile --tag grootscape-server:ci .
      - name: Probe the running container
        run: |
          docker run --detach --name server --publish 8080:8080 grootscape-server:ci
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/health/ready && exit 0
            sleep 1
          done
          docker logs server
          exit 1

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked --package grootscape-desktop -- --version
      - name: macOS app and window smoke test
        if: runner.os == 'macOS'
        run: |
          cargo run --locked --package grootscape-desktop -- --exit-after-frames 3
          cargo build --locked --release --package grootscape-native
          desktop_version="$(cargo run --quiet --locked --package grootscape-desktop -- --version)"
          mac_version="$(swift run --quiet --package-path apps/macos GrootscapeMac --version)"
          test "$desktop_version" = "grootscape-client $mac_version"

  web:
    name: Browser client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --locked --package grootscape-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked --release --package grootscape-web --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: wasm-bindgen --target web --no-typescript --out-dir apps/web/pkg target/wasm32-unknown-unknown/release/grootscape_web.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grootscape-web
          path: |
            apps/web/
            !apps/web/.gitignore

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - run: cargo clippy --locked --package grootscape-native --target aarch64-linux-android -- -D warnings
      - name: Build the debug APK
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ./gradlew assembleDebug --console=plain
      - name: Check the APK contains the engine for each ABI
        run: |
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libgrootscape_native.so'
          unzip -l "$apk" | grep -q 'lib/x86_64/libgrootscape_native.so'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grootscape-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
