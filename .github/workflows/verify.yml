name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404
      - run: dotnet restore Grootscape.slnx --locked-mode
      - run: dotnet format Grootscape.slnx --verify-no-changes --no-restore
      - run: dotnet build Grootscape.slnx --configuration Release --no-restore
      - run: dotnet test --solution Grootscape.slnx --configuration Release --no-build

  server-image:
    name: Server container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file deploy/server.Dockerfile --tag grootscape-server:ci .
      - name: Probe the running container
        run: |
          docker run --detach --name server --publish 8080:8080 grootscape-server:ci
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/health/ready && exit 0
            sleep 1
          done
          docker logs server
          exit 1

  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.404
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev wayland-protocols libegl1-mesa-dev libdrm-dev libgbm-dev
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem env: | ForEach-Object { "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append }
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel 4
      - name: Tests and window (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ctest --preset release
          xvfb-run -a build/release/grootscape-client --exit-after-frames 3
      - name: Tests and window
        if: runner.os != 'Linux'
        run: |
          ctest --preset release
          ./build/release/grootscape-client --exit-after-frames 3
      - name: Swift host
        if: runner.os == 'macOS'
        run: |
          version=$(swift run --quiet --package-path apps/macos GrootscapeMac --version)
          test "$(build/release/grootscape-client --version)" = "grootscape-client $version"
      - name: Server integration
        shell: bash
        run: |
          dotnet restore Grootscape.slnx --locked-mode
          dotnet build Grootscape.slnx --configuration Release --no-restore
          python3 tools/test-server-integration.py build/release/protocol-peer${{ runner.os == 'Windows' && '.exe' || '' }}

  cpp-quality:
    name: C++ quality (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan, tidy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18 ninja-build xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev wayland-protocols libegl1-mesa-dev libdrm-dev libgbm-dev
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy
          cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: TSan address space
        if: matrix.preset == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: xvfb-run -a ctest --preset ${{ matrix.preset }}
      - name: Format
        if: matrix.preset == 'tidy'
        run: |
          python3 -m venv /tmp/format
          /tmp/format/bin/pip install clang-format==22.1.8
          find src/client tests/client -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 | xargs -0 /tmp/format/bin/clang-format --dry-run --Werror

  web:
    name: Browser client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          git -C /tmp/emsdk checkout e4fe26ef59168ff44f4c23c466e497bf60b3411e
          /tmp/emsdk/emsdk install 4.0.20
          /tmp/emsdk/emsdk activate 4.0.20
      - name: Build and test browser
        run: |
          source /tmp/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/web --parallel 4
          cd tests/web
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grootscape-web
          path: apps/web/

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Check the APK contains the engine for each ABI
        run: |
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libgrootscape_native.so'
          unzip -l "$apk" | grep -q 'lib/x86_64/libgrootscape_native.so'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grootscape-android-test-results
          path: apps/android/app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grootscape-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
