name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404
      - run: dotnet restore Grootscape.slnx --locked-mode
      - run: dotnet format Grootscape.slnx --verify-no-changes --no-restore
      - run: dotnet build Grootscape.slnx --configuration Release --no-restore
      - run: dotnet test --solution Grootscape.slnx --configuration Release --no-build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked --package grootscape-client -- --version
      - if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --target-dir target --package grootscape-engine
          desktop_version="$(cargo run --quiet --locked --package grootscape-client -- --version)"
          mac_version="$(swift run --quiet --package-path apps/macos GrootscapeMac --version)"
          test "$desktop_version" = "grootscape-client $mac_version"
